<app-page>
  <h2 class="text-center mb-4">Hvem kan jeg hjælpe?</h2>

  @for (situation of situations; track situation.title; let i = $index) {
    <app-card
      [title]="situation.title"
      [ngClasses]="situation.background + ' shadow-sm mx-3 mx-md-0' + (i > 0 ? ' mt-4' : '')"
    >
      <div col-1>
        @for (paragraph of situation.paragraphs; track paragraph; let j = $index) {
          <p [class.mt-3]="j > 0">{{ paragraph }}</p>
        }
      </div>
      <div col-2>
        <img [src]="situation.image" [alt]="situation.alt" />
      </div>
    </app-card>
  }
</app-page>
