<section class="hero">
  <div class="container hero-inner">
    <div class="hero-text">
      <h1>{{ title }}</h1>
      <p class="lead">{{ lead }}</p>

      @if (ctaText && ctaLink) {
        <a [routerLink]="ctaLink" class="btn btn-primary btn-lg rounded-pill">
          {{ ctaText }}
        </a>
      }
    </div>

    <div class="hero-image">
      @if (imageSrc) {
        <img
          [ngSrc]="imageSrc"
          [alt]="imageAlt"
          [width]="imageWidth"
          [height]="imageHeight"
          priority
          class="hero-photo rounded-4"
        />
      } @else {
        <div class="hero-placeholder rounded-4">
          <i class="bi" [class]="icon"></i>
          <span>{{ placeholderText }}</span>
        </div>
      }
    </div>
  </div>
</section>
